<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>ThreeJS Heart Particles Bloom</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
  </style>
  <!-- Nhúng Three.js và các thư viện hỗ trợ Bloom -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Các script cần thiết cho hậu kỳ Bloom (Cực kỳ quan trọng để rực rỡ) -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
</head>
<body>

  <script>
    // 1. Khởi tạo Cơ bản
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 100);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio); // Tăng độ nét
    document.body.appendChild(renderer.domElement);

    // 2. Tạo Hậu kỳ Bloom (Làm cho các chấm RỰC RỠ và PHÁT SÁNG)
    const renderScene = new THREE.RenderPass(scene, camera);
    // Các thông số Bloom: (Kích thước cửa sổ, Độ mạnh, Bán kính, Ngưỡng ánh sáng)
    const bloomPass = new THREE.UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight), 
      2.5,  // Độ mạnh (Strength) - Tăng số này để sáng hơn
      0.4,  // Bán kính (Radius)
      0.1   // Ngưỡng (Threshold)
    );

    const composer = new THREE.EffectComposer(renderer);
    composer.addPass(renderScene);
    composer.addPass(bloomPass);

    // 3. Tạo Tọa độ Trái Tim
    const vertices = [];
    // Hàm toán học tạo hình trái tim 3D dẻo
    // Số 10000 là số lượng hạt, tăng lên nếu muốn dày hơn
    for (let i = 0; i < 10000; i++) {
      const t = Math.random() * Math.PI * 2;
      const p = Math.random() * Math.PI;

      // Phương trình trái tim 3D (phổ biến)
      let x = 16 * Math.pow(Math.sin(t), 3);
      let y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      let z = (Math.random() - 0.5) * 10; // Độ dày 3D

      // Phóng to
      const scale = 2.5;
      const vector = new THREE.Vector3(x * scale, y * scale, z * scale);
      
      // Thêm một chút độ nhiễu loạn
      vector.x += (Math.random() - 0.5) * 2;
      vector.y += (Math.random() - 0.5) * 2;
      
      vertices.push(vector);
    }

    // 4. Tạo Vật liệu Hạt Hồng
    const geometry = new THREE.BufferGeometry().setFromPoints(vertices);
    const material = new THREE.PointsMaterial({
      color: 0xff1493, // Màu hồng rực (DeepPink)
      size: 0.8,       // Kích thước hạt nhỏ để Bloom đẹp
      transparent: true,
      blending: THREE.AdditiveBlending, // Giúp các hạt đè lên nhau sáng hơn
      depthWrite: false
    });

    const heartParticles = new THREE.Points(geometry, material);
    scene.add(heartParticles);

    // 5. Hiệu ứng xoay
    function animate() {
      requestAnimationFrame(animate);
      
      // Xoay nhẹ theo 2 trục
      heartParticles.rotation.y += 0.005;
      heartParticles.rotation.x += 0.001;
      
      // Sử dụng Composer thay vì Renderer để áp dụng hiệu ứng Bloom
      composer.render();
    }
    animate();

    // 6. Xử lý đổi cỡ màn hình
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
