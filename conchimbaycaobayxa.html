<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird</title>
<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}

body {
background-color: #1a1a1a;
font-family: 'Arial', sans-serif;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
overflow: hidden;
}

#game-container {
position: relative;
width: 400px;
height: 600px;
box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
border-radius: 12px;
overflow: hidden;
}

canvas {
display: block;
background: #70c5ce;
}

/* Giao diện UI Đăng nhập & Bảng xếp hạng */
.ui-layer {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0, 0, 0, 0.75);
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
color: #fff;
z-index: 10;
padding: 20px;
}

.hidden {
display: none !important;
}

h2 {
margin-bottom: 15px;
color: #f1c40f;
text-transform: uppercase;
letter-spacing: 2px;
}

input[type="text"] {
width: 80%;
padding: 12px;
border: none;
border-radius: 25px;
outline: none;
text-align: center;
font-size: 16px;
margin-bottom: 15px;
}

button.start-btn {
padding: 12px 30px;
border: none;
border-radius: 25px;
background: #2ecc71;
color: white;
font-weight: bold;
font-size: 16px;
cursor: pointer;
transition: transform 0.2s, background 0.2s;
}

button.start-btn:hover {
background: #27ae60;
transform: scale(1.05);
}

.leaderboard {
width: 100%;
max-height: 180px;
overflow-y: auto;
margin-top: 15px;
background: rgba(255, 255, 255, 0.1);
border-radius: 8px;
padding: 10px;
}

.leaderboard-item {
display: flex;
justify-content: space-between;
padding: 6px 10px;
border-bottom: 1px solid rgba(255, 255, 255, 0.1);
font-size: 14px;
}

.leaderboard-item:last-child {
border-bottom: none;
}

/* Phong cách cho nút Mạng xã hội */
.social-links {
display: flex;
gap: 12px;
margin-top: 15px;
}

.social-btn {
display: inline-flex;
align-items: center;
justify-content: center;
padding: 8px 16px;
border-radius: 20px;
color: #fff;
text-decoration: none;
font-size: 13px;
font-weight: bold;
transition: transform 0.2s, opacity 0.2s;
}

.social-btn:hover {
transform: scale(1.08);
opacity: 0.9;
}

.btn-facebook {
background-color: #1877f2;
}

.btn-instagram {
background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
}
</style>
</head>
<body>

<div id="game-container">
<canvas id="birdCanvas" width="400" height="600"></canvas>

<!-- Màn hình đăng nhập & Bảng xếp hạng -->
<div id="login-screen" class="ui-layer">
<h2>Flappy Bird</h2>
<input type="text" id="player-name" placeholder="Nhập tên người chơi..." maxlength="15">
<button id="start-btn" class="start-btn">BẮT ĐẦU CHƠI</button>
<div class="leaderboard" id="leaderboard-list">
<!-- Bảng xếp hạng sẽ tự động cập nhật ở đây -->
</div>

<!-- Nút liên kết Facebook & Instagram của bạn -->
<div class="social-links">
<!-- THAY LINK FACEBOOK CỦA BẠN VÀO HREF DƯỚI ĐÂY -->
<a href="https://www.facebook.com/thienqyang" target="_blank" class="social-btn btn-facebook">
Facebook
</a>

<!-- THAY LINK INSTAGRAM CỦA BẠN VÀO HREF DƯỚI ĐÂY -->
<a href="https://www.instagram.com/#reactivated" target="_blank" class="social-btn btn-instagram">
Instagram
</a>
</div>
</div>
</div>

<script>
const canvas = document.getElementById('birdCanvas');
const ctx = canvas.getContext('2d');

const loginScreen = document.getElementById('login-screen');
const playerNameInput = document.getElementById('player-name');
const startBtn = document.getElementById('start-btn');
const leaderboardList = document.getElementById('leaderboard-list');

// Biến game
let gameState = 'START'; // START, PLAYING, GAMEOVER
let playerName = '';
let score = 0;
let frames = 0;

// Con chim
const bird = {
x: 50,
y: 150,
w: 30,
h: 30,
gravity: 0.25,
jump: 4.6,
velocity: 0,
draw() {
ctx.fillStyle = '#f1c40f';
ctx.beginPath();
ctx.arc(this.x, this.y, 15, 0, Math.PI * 2);
ctx.fill();
// Mắt
ctx.fillStyle = '#fff';
ctx.beginPath();
ctx.arc(this.x + 6, this.y - 4, 5, 0, Math.PI * 2);
ctx.fill();
ctx.fillStyle = '#000';
ctx.beginPath();
ctx.arc(this.x + 8, this.y - 4, 2, 0, Math.PI * 2);
ctx.fill();

// Mỏ
ctx.fillStyle = '#e67e22';
ctx.beginPath();
ctx.arc(this.x + 10, this.y + 2, 6, 0, Math.PI * 2);
ctx.fill();
},
update() {
if (gameState === 'PLAYING') {
this.velocity += this.gravity;
this.y += this.velocity;

// Va chạm mặt đất
if (this.y + 15 >= canvas.height - 50) {
this.y = canvas.height - 50 - 15;
gameOver();
}
}
},
flap() {
this.velocity = -this.jump;
},

reset() {
this.y = 150;
this.velocity = 0;
}
};

// Ống nước
const pipes = {
position: [],
w: 50,
gap: 120,
dx: 2,

draw() {
ctx.fillStyle = '#2ecc71';
for (let p of this.position) {
// Ống trên
ctx.fillRect(p.x, 0, this.w, p.top);
// Ống dưới
ctx.fillRect(p.x, p.top + this.gap, this.w, canvas.height - p.top - this.gap - 50);
}
},

update() {
if (gameState !== 'PLAYING') return;

if (frames % 100 === 0) {
this.position.push({
x: canvas.width,
top: Math.floor(Math.random() * (250 - 50 + 1)) + 50
});
}

for (let i = 0; i < this.position.length; i++) {
let p = this.position[i];
p.x -= this.dx;

// Va chạm ống
if (
bird.x + 15 > p.x &&
bird.x - 15 < p.x + this.w &&
(bird.y - 15 < p.top || bird.y + 15 > p.top + this.gap)
) {
gameOver();
}

// Cộng điểm
if (p.x + this.w < bird.x && !p.passed) {
score++;
p.passed = true;
}

// Xóa ống ngoài màn hình
if (p.x + this.w < 0) {
this.position.shift();
i--;
}
}
},

reset() {
this.position = [];
}
};

// Mặt đất
const fg = {
h: 50,
draw() {
ctx.fillStyle = '#ded895';
ctx.fillRect(0, canvas.height - this.h, canvas.width, this.h);
ctx.fillStyle = '#73bf2e';
ctx.fillRect(0, canvas.height - this.h, canvas.width, 10);
}
};

// Quản lý Bảng xếp hạng (LocalStorage)
function getScores() {
return JSON.parse(localStorage.getItem('flappy_scores')) || [];
}

function saveScore(name, score) {
if (!name) return;
let scores = getScores();
scores.push({ name, score });
scores.sort((a, b) => b.score - a.score);
scores = scores.slice(0, 5); // Giữ top 5
localStorage.setItem('flappy_scores', JSON.stringify(scores));
}

function updateLeaderboardUI() {
const scores = getScores();
leaderboardList.innerHTML = '<h3 style="margin-bottom:8px; text-align:center;">TOP BẢNG XẾP HẠNG</h3>';
if (scores.length === 0) {
leaderboardList.innerHTML += '<div style="text-align:center; font-size:12px; color:#ccc;">Chưa có dữ liệu</div>';
return;
}
scores.forEach((item, index) => {
leaderboardList.innerHTML += `
<div class="leaderboard-item">
<span>#${index + 1} ${item.name}</span>
<span><b>${item.score}</b> đ</span>
</div>
`;
});
}

// Sự kiện & Xử lý Game
startBtn.addEventListener('click', startGame);

window.addEventListener('keydown', (e) => {
if (e.code === 'Space') {
if (gameState === 'PLAYING') {
bird.flap();
} else if (gameState === 'GAMEOVER') {
resetGame();
}
}
});

canvas.addEventListener('click', () => {
if (gameState === 'PLAYING') {
bird.flap();
} else if (gameState === 'GAMEOVER') {
resetGame();
}
});

function startGame() {
const name = playerNameInput.value.trim();
if (!name) {
alert('Vui lòng nhập tên của bạn!');
return;
}
playerName = name;
loginScreen.classList.add('hidden');
resetGame();
}

function gameOver() {
gameState = 'GAMEOVER';
saveScore(playerName, score);
updateLeaderboardUI();
setTimeout(() => {
loginScreen.classList.remove('hidden');
}, 500);
}

function resetGame() {
bird.reset();
pipes.reset();
score = 0;
frames = 0;
gameState = 'PLAYING';
}

// Vẽ điểm lên Canvas
function drawScore() {
ctx.fillStyle = '#FFF';
ctx.strokeStyle = '#000';
ctx.lineWidth = 2;
ctx.font = '35px Squrific, sans-serif';
ctx.fillText(score, canvas.width / 2 - 10, 50);
ctx.strokeText(score, canvas.width / 2 - 10, 50);
}

// Vòng lặp Game
function loop() {
ctx.fillStyle = '#70c5ce';
ctx.fillRect(0, 0, canvas.width, canvas.height);

pipes.draw();
pipes.update();
fg.draw();
bird.draw();
bird.update();

if (gameState === 'PLAYING') {
drawScore();
}

frames++;
requestAnimationFrame(loop);
}

// Khởi chạy ban đầu
updateLeaderboardUI();
loop();
</script>
</body>
</html>
