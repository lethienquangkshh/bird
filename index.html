<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stickman Bubble Sort Animation with Sound</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #0d0d11;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .header {
      text-align: center;
      margin-bottom: 15px;
      max-width: 600px;
    }
    .header p {
      color: #aaa;
      font-size: 15px;
      line-height: 1.4;
      margin-bottom: 10px;
    }
    .complexity {
      background: #16161e;
      padding: 6px 16px;
      border-radius: 6px;
      display: inline-block;
      border: 1px solid #282838;
      font-weight: bold;
    }
    .complexity span {
      color: #4db8ff;
    }
    canvas {
      background: #121218;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      border: 1px solid #222230;
    }
    .controls {
      margin-top: 20px;
      display: flex;
      gap: 15px;
    }
    button {
      padding: 10px 24px;
      background: #4db8ff;
      border: none;
      color: #000;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }
    button:hover {
      background: #80d4ff;
    }
  </style>
</head>
<body>

  <div class="header">
    <p>The Stickman repeatedly swaps adjacent numbers if they are in wrong order.</p>
    <div class="complexity">
      Time: <span>O(n²)</span> &nbsp;&nbsp;&nbsp; Space: <span>O(1)</span>
    </div>
  </div>

  <canvas id="sortCanvas" width="650" height="320"></canvas>
  
  <div class="controls">
    <button onclick="restartAnimation()">Chạy lại</button>
  </div>

  <script>
    // --- 1. TẠO BỘ PHÁT ÂM THANH BẰNG WEB AUDIO API ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioCtx();
      }
    }

    // Âm thanh tiếng bước chân
    function playStepSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(120, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.05);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }

    // Âm thanh nhấc / trượt bóng (Bloop/Pop)
    function playSwapSound(freq = 400) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(freq * 1.8, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    // Âm thanh khi đặt bóng xuống mặt đất
    function playDropSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(200, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    }

    // Âm thanh hoàn thành (Chime)
    function playWinSound() {
      if (!audioCtx) return;
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
        setTimeout(() => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.3);
        }, idx * 100);
      });
    }


    // --- 2. CẤU HÌNH VÀ VẼ CANVAS ---
    const canvas = document.getElementById("sortCanvas");
    const ctx = canvas.getContext("2d");

    const initialNumbers = [45, 30, 51, 68, 24, 90, 12];
    let balls = [];

    const groundY = 240;
    const startX = 80;
    const gap = 75;

    let stickmanX = startX;
    let i = 0, j = 0;
    let isSortedCount = 0;
    let state = "MOVE";
    let animProgress = 0;
    let stepTimer = 0;
    let hasPlayedWinSound = false;

    class Ball {
      constructor(val, index) {
        this.val = val;
        this.x = startX + index * gap;
        this.y = groundY - 25;
        this.radius = 22;
        this.status = "normal";
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);

        ctx.save();
        if (this.status === "active") {
          ctx.fillStyle = "#ff4d4d";
          ctx.shadowColor = "#ff3333";
          ctx.shadowBlur = 18;
        } else if (this.status === "sorted") {
          ctx.fillStyle = "#76e033";
          ctx.shadowColor = "#66cc00";
          ctx.shadowBlur = 18;
        } else {
          ctx.fillStyle = "#d0d0d0";
          ctx.shadowColor = "#aaaaaa";
          ctx.shadowBlur = 5;
        }

        ctx.fill();
        ctx.restore();

        ctx.fillStyle = "#000";
        ctx.font = "bold 15px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(this.val, this.x, this.y);
      }
    }

    function init() {
      balls = initialNumbers.map((num, idx) => new Ball(num, idx));
      stickmanX = balls[0].x - 30;
      i = 0;
      j = 0;
      isSortedCount = 0;
      state = "MOVE";
      animProgress = 0;
      hasPlayedWinSound = false;
    }

    function drawGround() {
      ctx.fillStyle = "#22222d";
      ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
      ctx.strokeStyle = "#383848";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      ctx.lineTo(canvas.width, groundY);
      ctx.stroke();
    }

    function drawStickman(x, liftArm = false) {
      const headY = groundY - 70;
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 3;
      ctx.lineCap = "round";

      ctx.beginPath();
      ctx.arc(x, headY, 10, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(x, headY + 10);
      ctx.lineTo(x, groundY - 25);
      ctx.stroke();

      // Chân di chuyển nhịp nhàng
      const legOffset = Math.sin(x * 0.2) * 8;
      ctx.beginPath();
      ctx.moveTo(x, groundY - 25);
      ctx.lineTo(x - 12 + legOffset, groundY);
      ctx.moveTo(x, groundY - 25);
      ctx.lineTo(x + 12 - legOffset, groundY);
      ctx.stroke();

      // Tay
      ctx.beginPath();
      if (liftArm) {
        ctx.moveTo(x, headY + 25);
        ctx.lineTo(x - 22, headY + 10);
        ctx.moveTo(x, headY + 25);
        ctx.lineTo(x + 22, headY + 30);
      } else {
        ctx.moveTo(x, headY + 25);
        ctx.lineTo(x - 15, headY + 40);
        ctx.moveTo(x, headY + 25);
        ctx.lineTo(x + 15, headY + 40);
      }
      ctx.stroke();
    }

    // --- 3. ANIMATION LOOP ---
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawGround();

      const n = balls.length;

      balls.forEach((b, idx) => {
        if (idx >= n - isSortedCount) {
          b.status = "sorted";
        } else if (idx === j || idx === j + 1) {
          b.status = "active";
        } else {
          b.status = "normal";
        }
      });

      if (i < n - 1) {
        let b1 = balls[j];
        let b2 = balls[j + 1];
        let targetX = (b1.x + b2.x) / 2;

        if (state === "MOVE") {
          const dist = targetX - stickmanX;
          if (Math.abs(dist) > 2) {
            stickmanX += dist * 0.08;
            
            // Âm thanh bước chân theo chu kỳ di chuyển
            stepTimer++;
            if (stepTimer % 12 === 0) playStepSound();
          } else {
            if (b1.val > b2.val) {
              state = "LIFT";
              playSwapSound(350); // Phát âm thanh khi chuẩn bị đổi
            } else {
              state = "NEXT";
            }
          }
        } else if (state === "LIFT") {
          animProgress += 0.05;
          b1.y = groundY - 25 - Math.sin(animProgress * Math.PI) * 35;
          if (animProgress >= 0.5) {
            state = "SWAP";
            animProgress = 0;
            playSwapSound(550); // Âm thanh trượt bóng
          }
        } else if (state === "SWAP") {
          animProgress += 0.04;
          let distance = gap;
          b1.x += 0.04 * distance;
          b2.x -= 0.04 * distance;

          if (animProgress >= 1) {
            balls[j] = b2;
            balls[j + 1] = b1;
            b1.x = startX + (j + 1) * gap;
            b2.x = startX + j * gap;
            state = "DROP";
            animProgress = 0;
          }
        } else if (state === "DROP") {
          animProgress += 0.05;
          b1.y = groundY - 60 + animProgress * 35;
          if (animProgress >= 1) {
            b1.y = groundY - 25;
            playDropSound(); // Âm thanh đặt bóng xuống
            state = "NEXT";
            animProgress = 0;
          }
        } else if (state === "NEXT") {
          j++;
          if (j >= n - 1 - i) {
            j = 0;
            i++;
            isSortedCount++;
          }
          state = "MOVE";
        }
      } else {
        isSortedCount = n;
        stickmanX += (canvas.width + 50 - stickmanX) * 0.05;
        
        if (!hasPlayedWinSound) {
          playWinSound(); // Âm thanh chúc mừng hoàn thành
          hasPlayedWinSound = true;
        }
      }

      balls.forEach(b => b.draw());
      drawStickman(stickmanX, state === "LIFT" || state === "SWAP");

      requestAnimationFrame(animate);
    }

    function restartAnimation() {
      initAudio();
      init();
    }

    // Kích hoạt Audio Context ngay từ lần chạm đầu tiên
    window.addEventListener('click', initAudio, { once: true });

    init();
    animate();
  </script>
</body>
</html>
